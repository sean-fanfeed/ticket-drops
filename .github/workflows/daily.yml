name: Daily ticket drops

on:
  schedule:
    # MEASURED 2026-10-02: GitHub ran these ~5 HOURS late.
    #   "40 12" fired 18:01 UTC   "20 13" fired 18:32   "10 14" fired 19:16
    # Free-tier scheduled jobs queue behind everything else; delay is unbounded
    # and they are sometimes dropped outright. So we fire early and often rather
    # than near the time we actually want, and let whichever lands first win.
    # state.json dedupes pushes, so extra runs only refresh the page.
    - cron: "40 6 * * *"
    - cron: "40 9 * * *"
    - cron: "40 11 * * *"
    - cron: "40 12 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-drops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fold in watchlist edits pushed from the phone
        env:
          WATCHLIST_TOPIC: ${{ secrets.WATCHLIST_TOPIC }}
        run: python3 ticketdrops.py --sync-watchlist

      - name: Pull, score and publish
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCHLIST_TOPIC: ${{ secrets.WATCHLIST_TOPIC }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: python3 ticketdrops.py --out-dir docs --page-name index.html

      - name: Commit the day's page
        run: |
          git config user.name  "ticket-drops bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json watchlist.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "drops $(date -u +%Y-%m-%d)"
          git push
